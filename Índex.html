<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afinador de Ukulele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única, mostrador de centésimos no topo, quatro cordas embaixo */
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --ink: #1f2a2e;
  --muted: #667378;
  --accent: #1f6f6b;
  --ok: #2f8f4e;
  --warn: #c2571a;
  --line: #d9d3c6;
  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191b; --surface: #1d2427; --ink: #eceae3; --muted: #93a0a4;
    --accent: #5ec2b9; --ok: #62c27f; --warn: #f09a62; --line: #2f3a3e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191b; --surface: #1d2427; --ink: #eceae3; --muted: #93a0a4;
  --accent: #5ec2b9; --ok: #62c27f; --warn: #f09a62; --line: #2f3a3e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  display: flex; justify-content: center; padding: 24px 16px 40px;
}
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }

.meter { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.note { font-family: var(--font-display); font-size: 88px; line-height: 1; text-align: center; min-height: 88px; font-variant-numeric: tabular-nums; }
.note.ok { color: var(--ok); }
.readout { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 44px; }
.scale .track { position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--line); }
.scale .zone { position: absolute; left: 45%; width: 10%; top: 14px; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--ok) 22%, transparent); border: 1px solid var(--ok); }
.scale .needle { position: absolute; top: 6px; width: 4px; height: 32px; margin-left: -2px; border-radius: 2px; background: var(--muted); left: 50%; transition: left 120ms linear, background 120ms; }
.scale .needle.ok { background: var(--ok); }
.scale .needle.off { background: var(--warn); }
.scale span { position: absolute; top: 28px; font-size: 12px; color: var(--muted); transform: translateX(-50%); }
.status { text-align: center; font-weight: 700; min-height: 24px; }
.status.ok { color: var(--ok); }
.status.off { color: var(--warn); }

.strings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.string { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font: inherit; color: var(--ink); }
.string:hover { border-color: var(--accent); }
.string:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.string .n { font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
.string .l { font-size: 12px; color: var(--muted); }
.string .h { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.string.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.string.done { border-color: var(--ok); }

.btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 18px; background: var(--accent); color: var(--bg); cursor: pointer; }
.btn.stop { background: var(--ink); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.err { color: var(--warn); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { .scale .needle { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Afinador de Ukulele</h1>
    <p class="sub">Afinação padrão G-C-E-A (Sol, Dó, Mi, Lá)</p>
  </header>

  <section class="meter" aria-live="polite">
    <div class="note" id="note">–</div>
    <div class="scale" aria-hidden="true">
      <div class="track"></div>
      <div class="zone"></div>
      <div class="needle" id="needle"></div>
      <span style="left:0%">−50</span><span style="left:25%">−25</span><span style="left:50%">0</span><span style="left:75%">+25</span><span style="left:100%">+50</span>
    </div>
    <div class="status" id="status">Toque numa corda para ouvir a nota</div>
    <div class="readout"><span id="hz">– Hz</span><span id="cents">– cents</span></div>
  </section>

  <button class="btn" id="micBtn" type="button">Ativar microfone</button>
  <p class="err" id="err" hidden></p>

  <section>
    <div class="strings" id="strings"></div>
    <p class="hint" style="margin-top:12px">Toque numa corda para ouvir a nota de referência e afinar de ouvido. Com o microfone ligado, toque a corda e o afinador mostra a nota sozinho.</p>
  </section>
</main>

<script>
(function () {
  var STRINGS = [
    { name: "G", label: "4ª · Sol", hz: 392.00 },
    { name: "C", label: "3ª · Dó",  hz: 261.63 },
    { name: "E", label: "2ª · Mi",  hz: 329.63 },
    { name: "A", label: "1ª · Lá",  hz: 440.00 }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var noteEl = $("note"), needle = $("needle"), statusEl = $("status"),
      hzEl = $("hz"), centsEl = $("cents"), errEl = $("err"), micBtn = $("micBtn"), box = $("strings");
  var buttons = [], done = {};

  STRINGS.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "string"; b.id = "string-" + s.name;
    b.innerHTML = '<span class="n">' + s.name + '</span><span class="l">' + s.label + '</span><span class="h">' + s.hz.toFixed(1) + ' Hz</span>';
    b.addEventListener("click", function () { playTone(s, i); });
    box.appendChild(b); buttons.push(b);
  });

  function setActive(i) {
    buttons.forEach(function (b, k) { b.classList.toggle("active", k === i); });
  }

  // ---------- Notas de referência ----------
  var ctx = null;
  function audioCtx() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (ctx.state === "suspended") { ctx.resume(); }
    return ctx;
  }
  function playTone(s, i) {
    try {
      var c = audioCtx(), t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = s.hz;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 3.1);
    } catch (e) {}
    setActive(i);
    if (!listening) {
      noteEl.textContent = s.name; noteEl.classList.remove("ok");
      hzEl.textContent = s.hz.toFixed(2) + " Hz"; centsEl.textContent = "referência";
      statusEl.textContent = "Afine a corda até soar igual"; statusEl.className = "status";
      needle.style.left = "50%"; needle.className = "needle";
    }
  }

  // ---------- Microfone ----------
  var listening = false, stream = null, analyser = null, raf = 0, buf = null, srcNode = null;
  var smooth = null, lastSeen = 0;

  micBtn.addEventListener("click", function () { listening ? stopMic() : startMic(); });

  function startMic() {
    errEl.hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return fail("Este navegador não permite usar o microfone. Use as notas de referência.");
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function (s) {
        stream = s;
        var c = audioCtx();
        srcNode = c.createMediaStreamSource(s);
        analyser = c.createAnalyser(); analyser.fftSize = 4096;
        srcNode.connect(analyser);
        buf = new Float32Array(analyser.fftSize);
        listening = true; smooth = null;
        micBtn.textContent = "Parar microfone"; micBtn.classList.add("stop");
        statusEl.textContent = "Toque uma corda"; statusEl.className = "status";
        noteEl.textContent = "–"; hzEl.textContent = "– Hz"; centsEl.textContent = "– cents";
        loop();
      })
      .catch(function () {
        fail("Sem acesso ao microfone. Se esta página está dentro do Claude, o microfone fica bloqueado: abra o arquivo .html direto no navegador e permita o microfone.");
      });
  }
  function fail(msg) { errEl.textContent = msg; errEl.hidden = false; }
  function stopMic() {
    listening = false; cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
    if (srcNode) { srcNode.disconnect(); }
    micBtn.textContent = "Ativar microfone"; micBtn.classList.remove("stop");
    needle.style.left = "50%"; needle.className = "needle"; noteEl.classList.remove("ok");
    noteEl.textContent = "–"; statusEl.textContent = "Toque numa corda para ouvir a nota"; statusEl.className = "status";
    hzEl.textContent = "– Hz"; centsEl.textContent = "– cents"; setActive(-1);
  }

  // Autocorrelação normalizada, faixa 200–520 Hz
  function detect(data, sr) {
    var N = 2048, rms = 0, i;
    for (i = 0; i < N; i++) { rms += data[i] * data[i]; }
    if (Math.sqrt(rms / N) < 0.008) { return null; }
    var minLag = Math.floor(sr / 520), maxLag = Math.ceil(sr / 200);
    var r = new Float32Array(maxLag + 2), best = 0, lag;
    for (lag = minLag; lag <= maxLag + 1; lag++) {
      var num = 0, e1 = 0, e2 = 0;
      for (i = 0; i < N; i++) { var a = data[i], b = data[i + lag]; num += a * b; e1 += a * a; e2 += b * b; }
      r[lag] = num / (Math.sqrt(e1 * e2) + 1e-9);
      if (r[lag] > best) { best = r[lag]; }
    }
    if (best < 0.85) { return null; }
    var pick = -1;
    for (lag = minLag + 1; lag <= maxLag; lag++) {
      if (r[lag] > 0.93 * best && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) { pick = lag; break; }
    }
    if (pick < 0) { return null; }
    var y1 = r[pick - 1], y2 = r[pick], y3 = r[pick + 1], d = y1 - 2 * y2 + y3;
    var shift = d !== 0 ? 0.5 * (y1 - y3) / d : 0;
    return sr / (pick + shift);
  }

  function loop() {
    if (!listening) { return; }
    analyser.getFloatTimeDomainData(buf);
    var f = detect(buf, ctx.sampleRate), now = performance.now();
    if (f) {
      smooth = smooth === null || Math.abs(1200 * Math.log2(f / smooth)) > 80 ? f : smooth * 0.7 + f * 0.3;
      lastSeen = now; show(smooth);
    } else if (now - lastSeen > 1500 && smooth !== null) {
      smooth = null;
      noteEl.textContent = "–"; noteEl.classList.remove("ok"); needle.style.left = "50%"; needle.className = "needle";
      statusEl.textContent = "Toque uma corda"; statusEl.className = "status";
      hzEl.textContent = "– Hz"; centsEl.textContent = "– cents"; setActive(-1);
    }
    raf = requestAnimationFrame(loop);
  }

  function show(f) {
    var idx = 0, bestC = 1e9, k;
    for (k = 0; k < STRINGS.length; k++) {
      var c = Math.abs(1200 * Math.log2(f / STRINGS[k].hz));
      if (c < bestC) { bestC = c; idx = k; }
    }
    var s = STRINGS[idx], cents = 1200 * Math.log2(f / s.hz);
    var clamped = Math.max(-50, Math.min(50, cents));
    var ok = Math.abs(cents) <= 5;
    noteEl.textContent = s.name; noteEl.classList.toggle("ok", ok);
    needle.style.left = (50 + clamped) + "%"; needle.className = "needle " + (ok ? "ok" : "off");
    hzEl.textContent = f.toFixed(1) + " Hz";
    centsEl.textContent = (cents > 0 ? "+" : "") + cents.toFixed(0) + " cents";
    if (ok) { statusEl.textContent = "Afinada"; statusEl.className = "status ok"; done[s.name] = true; }
    else if (cents < 0) { statusEl.textContent = "Grave demais: aperte a tarraxa"; statusEl.className = "status off"; }
    else { statusEl.textContent = "Aguda demais: afrouxe a tarraxa"; statusEl.className = "status off"; }
    setActive(idx);
    buttons.forEach(function (b, j) { b.classList.toggle("done", !!done[STRINGS[j].name] && j !== idx); });
  }
})();
</script>
</body>
</html>
